# @package _global_

# CoinGame: PPO_memory vs PPO_memory (naive self-play / independent learners)
# Use this to get the self-play reference returns (v_ref) for welfare shaper training.
# Record the converged "Average Reward per Timestep: (r1, r2)" from the final iterations.

# Agents
agent1: 'PPO_memory'
agent2: 'PPO_memory'

# Environment
env_id: coin_game
env_type: sequential
egocentric: True
env_discount: 0.96
payoff: [[1, 1, -2], [1, 1, -2]]

# Runner
runner: rl

# Training
num_envs: 50
num_opps: 1
num_outer_steps: 1
num_inner_steps: 16
num_iters: 3000
save_interval: 1000

# PPO agent parameters
ppo1:
  num_minibatches: 8
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.05
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  output_channels: 16
  kernel_shape: [3, 3]
  separate: True
  hidden_size: 16

ppo2:
  num_minibatches: 8
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.05
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  output_channels: 16
  kernel_shape: [3, 3]
  separate: True
  hidden_size: 16

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: cg
  group: 'independentLearning-rl-3k-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: online
