# @package _global_

# COALA-PG vs paper-style naive A2C learner (IPD)
#
# Baseline reimplementation of:
#   Meulemans et al. (2025), "Multi-agent cooperation through learning-aware
#   policy gradients", ICLR 2025 (arXiv:2410.18636).
#
# Shape semantics for this runner (the paper's batched co-player shaping POMDP):
#   num_envs        = B, the lockstep batch each co-player learns from
#   num_outer_steps = M, inner episodes per meta-trajectory
#   num_inner_steps = T, steps per inner episode
#   num_opps        = independent replicas of the construction
#   num_iters       = number of meta-trajectories (i.e. COALA-PG updates)
#
# B must be > 1: the whole estimator rests on averaging future-episode credit
# across the co-player's minibatch, which is degenerate at B = 1.
#
# PPO batch per update = M * T * num_opps * num_envs
#                      = 20 * 10 * 8 * 16 = 25,600  (divisible by 2)

# Agents
agent1: 'CoalaPG'
agent2: 'CoalaA2C'     # naive A2C co-player from the COALA-PG paper

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: coala_pg

# Save
save: True
save_interval: 1000

# Training
#
# HORIZON IS LOAD-BEARING. Algorithm 1 needs discount = 1.0 (see coala_pg.py),
# so undiscounted returns over M*T must stay small enough for the critic to fit.
# At M=16, T=100 (|return| ~ 3200) the advantage was pure noise and the policy
# went uniform-random. This run follows the paper-style IPD horizon:
# B=16, M=20, T=10, so M*T = 200 while preserving the co-player batch size.
# T=10 departs from the T=100 used by the ES baselines; report this difference
# or re-run ES at this horizon before making direct table comparisons.
num_envs: 16           # B
num_opps: 128          # paper Table 2 `meta_batch_size`: independent co-players per update
# Paper Table 2 `population_size (naive)`: the co-player is re-initialised from
# a fixed pool of this many parameter vectors (0 = fresh random init each time).
naive_population_size: 10
num_outer_steps: 20    # M
num_inner_steps: 10    # T
num_iters: 3001
num_devices: 1

# COALA-PG shaper (agent1).
# NOTE: learning_rate here is a real PG step size, unlike the ES-trained
# Shaper/M-FOS configs where ppo1.learning_rate is inert. The recurrent torso
# uses the paper's IPD dimensions (width 32, zero-initialized policy/value
# heads), with a local Hawk-style fallback because Pax does not ship Hawk/LRU.
ppo1:
  num_minibatches: 2
  num_epochs: 4
  # MUST be 1.0 to keep the estimator faithful: Algorithm 1 applies
  # discount = gamma*lambda uniformly, and any value < 1 attenuates the
  # future-episode term (the learning-aware signal) by discount**T. At
  # 0.96/0.95 with T=100 that was a measured 10,012x -> always-defect.
  # Variance from undiscounted returns is controlled by the short horizon
  # (M*T = 200) above, not by discounting.
  gamma: 1.0
  gae_lambda: 1.0
  advantage_normalization: False
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.0003
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Naive co-player (agent2): A2C settings from Table 8 of the paper.
ppo2:
  num_minibatches: 1
  num_epochs: 1
  gamma: 0.99
  gae_lambda: 1.0
  advantage_normalization: True
  reward_rescaling: 0.05
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 1.0
  anneal_entropy: False
  entropy_coeff_start: 0.0
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 32

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'baseline-COALA-PG-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
