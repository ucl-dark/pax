# @package _global_

# Evaluate a pretrained Welfare Shaper (Attention) vs fresh Tabular learner (IPD)
# Freezes the shaper and lets the opponent learn over many episodes.

# Agents
agent1: 'WelfareShaperAtt'
agent2: 'Tabular'

# Environment
env_id: iterated_matrix_game
env_type: meta
env_discount: 0.96
payoff: [[-1, -1], [-3, 0], [0, -3], [-2, -2]]

# Runner
runner: welfare_eval
resume_dir: ""
# Training / Evaluation
num_envs: 20
num_opps: 1
num_outer_steps: 100    # opponent learns over 100 inner episodes per trial
num_inner_steps: 100
num_iters: 1            # one trial per job — multi-seed via launcher (20 seeds)
num_devices: 1
att_type: 'nothing'


