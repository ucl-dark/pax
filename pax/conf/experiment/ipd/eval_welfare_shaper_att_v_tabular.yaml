# PPO agent parameters (for WelfareShaperAtt = agent1)
ppo1:
  num_minibatches: 4
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.02
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 1
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 16

# PPO agent parameters (for Tabular = agent2)
ppo2:
  num_minibatches: 4
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.02
  entropy_coeff_horizon: 2000000
  entropy_coeff_end: 0.001
  lr_scheduling: False
  learning_rate: 1
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: False
  hidden_size: 16

# ES parameters
es:
  algo: OpenES
  sigma_init: 0.04
  sigma_decay: 0.999
  sigma_limit: 0.01
  init_min: 0.0
  init_max: 0.0
  clip_min: -1e10
  clip_max: 1e10
  lrate_init: 0.01
  lrate_decay: 0.9999
  lrate_limit: 0.01 #chaned from 0.001 to 0.01
  beta_1: 0.99
  beta_2: 0.999
  eps: 1e-8
  centered_rank: False
  w_decay: 0
  maximise: True
  z_score: False
  mean_reduce: True

# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipd
  group: 'eval-unconstrained-welfare-trainSeed73-${agent1}-vs-${agent2}'
  name: eval-seed-${seed}
  log: True
