# @package _global_

# Evaluate a pretrained Welfare Shaper (Attention) vs fresh PPO_memory (InTheMatrix/STORM)
# Freezes the shaper and lets the opponent learn over many episodes.

# Agents
agent1: 'WelfareShaperAtt' # WelfareShaperAtt
agent2: 'PPO_memory'

# Environment
env_id: InTheMatrix
env_type: meta
env_discount: 0.96
freeze: 5
payoff: [[[3, 0], [5, 1]], [[3, 5], [0, 1]]]
fixed_coins: True

save_interval: 100

runner: ipditm_eval_welfare
# Training / Evaluation
num_envs: 50
num_opps: 1
num_outer_steps: 500
num_inner_steps: 152
num_iters: 1   
att_type: avg            # one trial per job - multi-seed via launcher


Seed 3: most unstable multipliers
run_path: lichenqi-university-of-regina/ipditm/9txfr9et
model_path: exp/welfare-WelfareShaperAtt-vs-PPO_memory-mean_ref/run-seed-3/2026-04-30_07.49.34.445646/generation_1600
welfare:
  v_ref_shaper: 22.44
  v_ref_opponent: 21.49
