# @package _global_

# InTheMatrix: PPO_memory vs PPO_memory (naive self-play / independent learners)
# Use this to get the self-play reference returns (v_ref) for welfare shaper training.
# Record the converged "Average Reward per Timestep: (r1, r2)" from the final iterations.

# Agents
agent1: 'PPO_memory'
agent2: 'PPO_memory'

# Environment
env_id: InTheMatrix
env_type: sequential
env_discount: 0.96
freeze: 5
payoff: [[[3, 0], [5, 1]], [[3, 5], [0, 1]]]


fixed_coins: True

save: True
save_interval: 1000

runner: rl

num_envs: 50
num_opps: 1
num_outer_steps: 1
num_inner_steps: 152
num_iters: 1000
att_type: avg 


# Evaluation 
run_path: ucl-dark/cg/3sp0y2cy
model_path: exp/coin_game-PPO_memory-vs-PPO_memory-parity/run-seed-0/2022-09-12_11.21.52.633382/iteration_74900

# PPO agent parameters
ppo1:
  num_minibatches: 8
  num_epochs: 2
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.05
  lr_scheduling: False
  learning_rate: 0.005
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: True
  output_channels: 16
  kernel_shape: [3, 3]
  separate: True # only works with CNN
  hidden_size: 8

ppo2:
  num_minibatches: 8
  num_epochs: 2 
  gamma: 0.96
  gae_lambda: 0.95
  ppo_clipping_epsilon: 0.2
  value_coeff: 0.5
  clip_value: True
  max_gradient_norm: 0.5
  anneal_entropy: False
  entropy_coeff_start: 0.1
  entropy_coeff_horizon: 0.6e8
  entropy_coeff_end: 0.05
  lr_scheduling: False
  learning_rate: 0.005 #0.05
  adam_epsilon: 1e-5
  with_memory: True
  with_cnn: True
  output_channels: 16
  kernel_shape: [3, 3]
  separate: True # only works with CNN
  hidden_size: 8

# ES parameters
es:
  algo: OpenES
  sigma_init: 0.075
  sigma_decay: 0.999
  sigma_limit: 0.01
  init_min: 0.0
  init_max: 0.0
  clip_min: -1e10
  clip_max: 1e10
  lrate_init: 0.005
  lrate_decay: 0.999
  lrate_limit: 0.001
  beta_1: 0.99
  beta_2: 0.999
  eps: 1e-8
  elite_ratio: 0.1
  centered_rank: True
  w_decay: 0.1
  maximise: True
  z_score: False
  mean_reduce: False


# Logging setup
wandb:
  entity: "lichenqi-university-of-regina"
  project: ipditm
  group: 'independentLearning-rl-${agent1}-vs-${agent2}'
  name: run-seed-${seed}
  log: True
  mode: offline
